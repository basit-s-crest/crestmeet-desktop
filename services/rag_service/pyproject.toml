[project]
name = "crestmeet-rag"
version = "0.1.0"
description = "Local RAG, chunking, and embedding microservice for CrestMeet"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "fastembed>=0.3.0",
    "tiktoken>=0.6.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0.0",
    "soundfile>=0.12.0",
    "rapidocr-onnxruntime>=1.3.0",
    "opencv-python>=4.8.0",
    "winrt-runtime>=3.2.1; sys_platform == 'win32'",
    "winrt-windows-foundation>=3.2.1; sys_platform == 'win32'",
    "winrt-windows-foundation-collections>=3.2.1; sys_platform == 'win32'",
    "winrt-windows-media-ocr>=3.2.1; sys_platform == 'win32'",
    "winrt-windows-graphics-imaging>=3.2.1; sys_platform == 'win32'",
    "winrt-windows-storage-streams>=3.2.1; sys_platform == 'win32'",
    "winrt-windows-globalization>=3.2.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
